const RH=['等待区里先停好','空房闸闭抬杆进','绿进红停黄倒车','油缸找中开后门','选板启动人别走','震动自动看残料','平台降完关斗门','后挡落尽闸自开'];
const CAM=[[0,640],[100,780],[380,600],[400,560],[100,720],[100,800],[100,800],[380,630]];
let vb=[0,1010],vt=0,T=[],step=0,variant=0,auto=0,S={mud:false,started:0,fin:0};
function cam(i){const w=E('sc').parentNode.clientWidth,g=w<720?CAM[i]:[0,1010],f=vb.slice(),t0=performance.now();cancelAnimationFrame(vt);(function s(t){const k=Math.min(1,(t-t0)/700),e=k*k*(3-2*k);vb=[f[0]+(g[0]-f[0])*e,f[1]+(g[1]-f[1])*e];E('sc').setAttribute('viewBox',vb[0]+' 0 '+vb[1]+' 380');if(k<1)vt=requestAnimationFrame(s)})(t0)}
addEventListener('resize',()=>cam(step));
const at=(m,f)=>T.push(setTimeout(f,m)),clr=()=>{T.forEach(clearTimeout);T=[]};
const tr=(i,t,m)=>{const e=E(i);e.style.transitionDuration=m+'ms';e.style.transform=t};
const truck=(x,m)=>tr('truck',`translate(${x}px,0)`,m),plat=(a,m)=>tr('pl',`translate(240px,320px) rotate(${-a}deg)`,m);
const cov=(o,m)=>{tr('cvF',`scaleY(${o?1:.12})`,m);tr('cvN',`scaleY(${o?1:.12})`,m)};
const man=(x,s,m,y=320)=>{tr('man',`translate(${x}px,${y}px)`,m);E('man').style.opacity=s};
const dr=o=>tr('dr',`translate(-3px,-86px) scaleX(${o?6.5:1})`,900),mat=(f,m)=>tr('mat',`scaleY(${f})`,m);
const gate=(g,d)=>tr('g'+g,g?`translate(700px,232px) rotate(${d?0:80}deg)`:`translate(96px,232px) rotate(${d?0:-80}deg)`,800);
const stp=(l,m)=>{tr('rs',`scaleY(${l*30/34})`,m);tr('mon',`scaleY(${l*34/36})`,m);E('monT').textContent=l==0?'平放':l<.4?'1/3':l<.75?'未到位':'4/5 ✓'};
const tgPos=(x,m)=>{tr('tg',`translate(${x}px,0)`,m);const k=Math.max(1,212-x);tr('rod',`translate(${x}px,-9px) scale(${k},1)`,m);tr('rod2',`translate(${x}px,-15px) scale(${k},1)`,m)};
const tong=m=>E('tgr').setAttribute('class',m);
const light=c=>{['r','y','g'].forEach(k=>{E('l'+k).classList.toggle('on',k==c);E('h'+k).classList.toggle('on',k==c)})};
const vib=o=>E('shake').classList.toggle('vib',!!o),dump=o=>E('dust').classList.toggle('on',!!o);
const puff=()=>{const p=E('puff');p.classList.add('on');at(2200,()=>p.classList.remove('on'))};
function say(t,c){const e=E('say');e.textContent=t;e.className=c||''}
function mudSet(v){S.mud=v;E('mud').style.opacity=v?1:0;E('bm1').classList.toggle('sel',v);E('bm0').classList.toggle('sel',!v);if(step>=4&&step<=6)tong(v?'up':'')}
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.95;speechSynthesis.speak(u)}
const cur=()=>({v:D[step].t+'。'+D[step].s+D[step].a.join('；').replace(/<[^>]+>/g,'')+'。注意：'+D[step].w});
function base(i){clr();vib(0);dump(0);S.started=0;S.fin=0;S.top=(i==5||i==6)?1:0;
truck([-560,-390,180,12,12,12,12,12][i],0);plat(i==5||i==6?34:0,0);gate(0,1);gate(1,1);E('blk').style.opacity=0;
light('r');stp(i<3?0:.8,0);mat(i==5?.45:i>=6?0:1,0);cov(i==5||i==6?1:0,0);dr(i>=4&&i<=6?1:0);
man([0,0,0,490,232,-20,-20,232][i],i>=3?1:0,0,i==5||i==6?250:320);E('mud').style.opacity=S.mud?1:0;
if(i>=4&&i<=6){tgPos(160,0);tong(S.mud?'up':'')}else{tgPos(202,0);tong('ghost')}say('')}
function start(){if(step!=4||S.started)return;S.started=1;say('卸车启动 → 料斗门（里外两扇）打开 → 平台举升');cov(1,1800);at(1900,()=>{plat(34,5000);say('平台举升中（升到最顶后才能振动）')});at(6900,()=>{S.top=1;say('平台已升到最顶 → 震动器自动振动','ok');vib(1);mat(.45,3500);dump(1)});at(10500,()=>{vib(0);dump(0);say('震动器已按流程自动振动 → 下一步：按需再次开启','ok')})}
function vibBtn(){const o=!E('shake').classList.contains('vib');if(o&&!S.top){say('⚠ 平台未升到最顶，不能振动','bad');return}vib(o);if(step==5){dump(o);if(o){mat(0,3500);at(3600,()=>{vib(0);dump(0)})}}}
function fin(){if(step<6){go(6);return}if(step!=6||S.fin)return;S.fin=1;S.top=0;vib(0);dump(0);say('点击卸车完成 → 平台开始下降');plat(0,4500);
at(4700,()=>{say('平台下降到位 → 料斗门（里外两扇）关闭');cov(0,3200)});
at(8100,()=>{say('料斗门已关闭 → 前挡收回（缩回平台内）','ok');tong('ghost')});at(8900,()=>{say('纵移油缸缩回 → 前挡回到驾驶室后方起始位');tgPos(202,2200)});
at(11400,()=>{say('前挡已回位 → 司机走出操作室，整备车辆','ok');man(232,1,3600,250)});at(15100,()=>man(232,1,700,320));
at(16000,()=>{dr(0);say('后车门（两侧开）已关好 → 上车驶离','ok')})}
const P=[()=>{truck(-390,2500);say('车辆停靠在等待区 · 红灯，停车线内待命')},
()=>{if(!variant){say('✅ 室内无车 · 入口、出口道闸均关闭','ok');at(1500,()=>{gate(0,0);light('g');say('入口道闸抬起，同时变绿灯 → 车辆缓慢前行');truck(180,7500)});at(4800,()=>{gate(0,1);say('车尾已过入口 → 入口道闸关闭 · 车辆继续行驶，不停顿')});at(9100,()=>{light('r');say('行驶到出口道闸附近 → 停车 · 红灯（出口闸保持关闭）','ok')})}
else if(variant==1){E('blk').style.opacity=1;say('🚫 卸车室内有车 → 严禁驶入！','bad')}else{gate(0,0);gate(1,0);say('🚫 道闸未关闭 → 严禁驶入！','bad')}},
()=>{say('红灯 · 车辆停稳');at(600,()=>{light('y');say('黄灯 → 缓慢倒车 · 后挡升至后轮1/3高度');truck(60,3600);stp(1/3,3600)});at(4400,()=>{truck(12,2400);say('继续倒车，后轮靠近后挡…')});
if(!variant){at(6900,()=>{say('后轮顶住（相切）后挡 → 后挡升至后轮4/5','ok');stp(.8,1500)});at(8700,()=>{light('r');say('停车 → 放气 → 下车','ok');puff()});at(9200,()=>man(490,1,0))}
else{at(6900,()=>{stp(.55,1200);say('⚠ 后挡未升到4/5','bad')});at(8400,()=>{light('g');truck(50,1500);stp(.8,1500);say('往前行驶一点，直到后挡完全升起')});at(10300,()=>{light('y');truck(12,2000);say('再倒车，后轮顶住后挡')});at(12500,()=>{light('r');say('停车 → 放气 → 下车','ok');puff()});at(13000,()=>man(490,1,0))}},
()=>{say('驾驶员下车 → 纵移油缸伸出，前挡（虚框，收在平台内）从缩回位往车厢后方移动，寻找前轮两轮中间');tgPos(variant?180:160,3200);at(300,()=>man(400,1,2400));
if(!variant){at(3500,()=>{tong('');say('✅ 前挡落下到位 · 在前轮两个轮胎正中间（高度到轮胎中心）','ok')});at(5000,()=>man(232,1,2600));at(7800,()=>{dr(1);say('车后门（两侧开）已打开 → 回操作室','ok')})}
else{at(3500,()=>{tong('bad');say('❌ 前挡未在两轮中间！回前端系安全绳 → 操作室选【有挡泥板】','bad');mudSet(true)});at(6000,()=>man(232,1,2600));at(8800,()=>{dr(1);say('车后门（两侧开）已打开 → 回操作室','ok')})}},
()=>{say('走到操作室');man(232,1,700,250);at(700,()=>man(-20,1,3600,250));at(4600,()=>say('选择：'+(S.mud?'有':'无')+'挡泥板 → 点击卸车启动'));at(6200,start)},
()=>{vib(1);dump(1);mat(.15,3000);say('震动器自动振动中…');at(3200,()=>{vib(0);dump(0);say('自动振动结束 · 残料多？由司机决定再次开启【震动器】')});at(6200,()=>{vib(1);dump(1);mat(0,2500);say('司机再次开启震动器')});at(8800,()=>{vib(0);dump(0);say('物料卸净 → 点【卸车完成】','ok')})},
()=>{at(1500,fin)},
()=>{say('司机回驾驶室');man(490,1,2500);at(2600,()=>{man(490,0,0);light('g');say('启动车辆 → 绿灯 · 缓慢前行，后挡慢慢下降');truck(110,4500);stp(0,4500)});at(7200,()=>{say('后挡完全下降到位 → 出口道闸自动打开','ok');gate(1,0)});at(8200,()=>{say('车辆驶离卸车室 · 一路平安！','ok');truck(560,6000)})}];
const dur=()=>[3500,10500,variant?14200:10200,variant?11500:10500,17200,10000,18500,14500][step];
function render(){const d=D[step];E('bn').textContent=step+1;E('bt').textContent=d.t;E('sl').textContent=d.s;E('wn').textContent='⚠ '+d.w;
E('ac').innerHTML=d.a.map(x=>`<div class="ac">▸ <span>${x}</span></div>`).join('');
E('vr').innerHTML=d.v?d.v.map((x,k)=>`<button class="${variant==k?'am':''}" onclick="variant=${k};go(step,1)">${x}</button>`).join(''):'';
E('pills').innerHTML=D.map((x,i)=>`<button class="${i==step?'on':''}" onclick="go(${i})">${i+1}. ${x.t.split(' · ')[0]}</button>`).join('')}
function go(i,keep){if(!keep&&i!=step)variant=0;step=i;render();cam(i);base(i);void E('sc').getBoundingClientRect();at(60,P[i]);if(auto)at(dur(),()=>go((step+1)%8))}
function togAuto(){auto=!auto;E('ap').textContent=auto?'⏸ 暂停自动':'▶ 自动演示';go(step,1)}
function estop(){clr();['truck','pl','man','cvF','cvN','mat','rs','mon','dr','tg','rod','rod2','g0','g1'].forEach(i=>{const e=E(i);e.style.transitionDuration='0ms';e.style.transform=getComputedStyle(e).transform});vib(0);dump(0);auto=0;E('ap').textContent='▶ 自动演示';say('🛑 急停已按下 · 全部动作停止（点「重播本步」复位）','bad')}
E('rh').innerHTML=RH.map((x,i)=>`<div onclick="go(${i});speak('${x}')"><i>${i+1}</i>${x}</div>`).join('');
mudSet(false);go(0);
</script></body></html>
